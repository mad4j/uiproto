syntax = "proto3";

package hmi.protocol;

// Common types
// Timestamp in milliseconds since epoch
message Timestamp {
  int64 milliseconds = 1;
}

// Unique identifier for a UI component or device
message ComponentId {
  string id = 1;
}

// Value types for HMI components
message Value {
  oneof value_type {
    bool bool_value = 1;
    int32 int_value = 2;
    double double_value = 3;
    string string_value = 4;
    bytes bytes_value = 5;
  }
}

// ============================================================================
// UI Widget Definitions
// ============================================================================

// Button widget
message Button {
  ComponentId id = 1;
  string label = 2;
  bool enabled = 3;
  string icon = 4;
}

// Slider widget for numeric input
message Slider {
  ComponentId id = 1;
  string label = 2;
  double min_value = 3;
  double max_value = 4;
  double current_value = 5;
  double step = 6;
  bool enabled = 7;
}

// Toggle switch widget
message Switch {
  ComponentId id = 1;
  string label = 2;
  bool state = 3;
  bool enabled = 4;
}

// Text input field
message TextField {
  ComponentId id = 1;
  string label = 2;
  string value = 3;
  string placeholder = 4;
  bool enabled = 5;
  bool password = 6;
}

// Display-only text label
message Label {
  ComponentId id = 1;
  string text = 2;
  LabelStyle style = 3;
}

enum LabelStyle {
  LABEL_NORMAL = 0;
  LABEL_HEADING = 1;
  LABEL_SUBHEADING = 2;
  LABEL_WARNING = 3;
  LABEL_ERROR = 4;
  LABEL_SUCCESS = 5;
}

// Numeric display with units
message NumericDisplay {
  ComponentId id = 1;
  string label = 2;
  double value = 3;
  string unit = 4;
  int32 decimal_places = 5;
}

// Progress bar
message ProgressBar {
  ComponentId id = 1;
  string label = 2;
  double current = 3;
  double max = 4;
  bool indeterminate = 5;
}

// Dropdown selector
message Selector {
  ComponentId id = 1;
  string label = 2;
  repeated string options = 3;
  int32 selected_index = 4;
  bool enabled = 5;
}

// ============================================================================
// Commands - From Web App to Device
// ============================================================================

message Command {
  string request_id = 1;
  Timestamp timestamp = 2;
  
  oneof command_type {
    ButtonPress button_press = 10;
    SliderChange slider_change = 11;
    SwitchToggle switch_toggle = 12;
    TextInput text_input = 13;
    SelectorChange selector_change = 14;
    ConfigurationUpdate configuration_update = 15;
    GetStatus get_status = 16;
    GetConfiguration get_configuration = 17;
  }
}

message ButtonPress {
  ComponentId button_id = 1;
}

message SliderChange {
  ComponentId slider_id = 1;
  double new_value = 2;
}

message SwitchToggle {
  ComponentId switch_id = 1;
  bool new_state = 2;
}

message TextInput {
  ComponentId text_field_id = 1;
  string new_value = 2;
}

message SelectorChange {
  ComponentId selector_id = 1;
  int32 selected_index = 2;
}

message ConfigurationUpdate {
  repeated ConfigParameter parameters = 1;
}

message ConfigParameter {
  string key = 1;
  Value value = 2;
}

message GetStatus {
  // Request current device status
  repeated ComponentId component_ids = 1; // Empty means all components
}

message GetConfiguration {
  // Request current configuration
  repeated string keys = 1; // Empty means all configuration
}

// ============================================================================
// Events - From Device to Web App
// ============================================================================

message Event {
  string event_id = 1;
  Timestamp timestamp = 2;
  
  oneof event_type {
    StatusUpdate status_update = 10;
    Alert alert = 11;
    ConfigurationResponse configuration_response = 12;
    ComponentUpdate component_update = 13;
    TelemetryData telemetry = 14;
    ErrorResponse error_response = 15;
  }
}

message StatusUpdate {
  DeviceStatus device_status = 1;
  repeated ComponentStatus component_statuses = 2;
}

message DeviceStatus {
  string device_id = 1;
  string device_name = 2;
  DeviceState state = 3;
  string firmware_version = 4;
  double uptime_seconds = 5;
}

enum DeviceState {
  DEVICE_OFFLINE = 0;
  DEVICE_INITIALIZING = 1;
  DEVICE_READY = 2;
  DEVICE_RUNNING = 3;
  DEVICE_ERROR = 4;
  DEVICE_MAINTENANCE = 5;
}

message ComponentStatus {
  ComponentId component_id = 1;
  Value current_value = 2;
  bool enabled = 3;
  string status_text = 4;
}

message Alert {
  AlertLevel level = 1;
  string message = 2;
  string code = 3;
  ComponentId related_component = 4;
  bool requires_acknowledgment = 5;
}

enum AlertLevel {
  ALERT_INFO = 0;
  ALERT_WARNING = 1;
  ALERT_ERROR = 2;
  ALERT_CRITICAL = 3;
}

message ConfigurationResponse {
  string request_id = 1; // Correlates to ConfigurationUpdate or GetConfiguration
  bool success = 2;
  repeated ConfigParameter parameters = 3;
  string error_message = 4;
}

message ComponentUpdate {
  oneof component {
    Button button = 1;
    Slider slider = 2;
    Switch switch = 3;
    TextField text_field = 4;
    Label label = 5;
    NumericDisplay numeric_display = 6;
    ProgressBar progress_bar = 7;
    Selector selector = 8;
  }
}

message TelemetryData {
  repeated TelemetryPoint points = 1;
}

message TelemetryPoint {
  string metric_name = 1;
  Value value = 2;
  Timestamp timestamp = 3;
  map<string, string> tags = 4;
}

message ErrorResponse {
  string request_id = 1; // Correlates to the command that caused the error
  ErrorCode code = 2;
  string message = 3;
  string details = 4;
}

enum ErrorCode {
  UNKNOWN_ERROR = 0;
  INVALID_COMPONENT = 1;
  INVALID_VALUE = 2;
  COMPONENT_DISABLED = 3;
  DEVICE_NOT_READY = 4;
  TIMEOUT = 5;
  PERMISSION_DENIED = 6;
  CONFIGURATION_ERROR = 7;
}

// ============================================================================
// Message Envelope - Top-level message for bidirectional communication
// ============================================================================

message Message {
  string message_id = 1;
  Timestamp timestamp = 2;
  
  oneof payload {
    Command command = 10;
    Event event = 11;
    Heartbeat heartbeat = 12;
  }
}

message Heartbeat {
  string source = 1; // "webapp" or "device"
  int64 sequence_number = 2;
}

// ============================================================================
// UI Layout and Configuration
// ============================================================================

message UILayout {
  string layout_id = 1;
  string name = 2;
  repeated UISection sections = 3;
}

message UISection {
  string section_id = 1;
  string title = 2;
  repeated ComponentReference components = 3;
}

message ComponentReference {
  ComponentId component_id = 1;
  int32 row = 2;
  int32 column = 3;
  int32 width = 4;
  int32 height = 5;
}

message InitialConfiguration {
  DeviceStatus device_status = 1;
  UILayout ui_layout = 2;
  repeated ComponentUpdate components = 3;
  repeated ConfigParameter configuration = 4;
}
